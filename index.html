<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h1>Personal Expense Tracker</h1>
    </header>
    
    <section class="summary-section">
      <div class="summary-card">
        <h3>Total Expenses</h3>
        <p id="totalCount">0</p>
      </div>
      <div class="summary-card">
        <h3>Total Amount Spent</h3>
        <p id="totalAmount">0 Birr</p>
      </div>
    </section>

    <section class="form-section">
      <h2>Add New Expense</h2>
      <form id="expenseForm">
        <div class="form-group">
          <label for="name">Expense Name</label>
          <input type="text" id="name" placeholder="e.g., Coffee">
        </div>

        <div class="form-group">
          <label for="amount">Amount (Birr)</label>
          <input type="number" id="amount" placeholder="e.g., 50" step="any">
        </div>

        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="form-group">
          <label for="date">Date</label>
          <input type="date" id="date">
        </div>

        <button type="submit" id="submitBtn">Add Expense</button>
      </form>
      <div id="errorMessage" class="error-message"></div>
    </section>

    <section class="controls-section">
      <h2>Manage Expenses</h2>
      <div class="controls-grid">
        <div class="control-group">
          <label for="search">Search</label>
          <input type="text" id="search" placeholder="Search by name or category...">
        </div>

        <div class="control-group">
          <label for="filterCategory">Filter by Category</label>
          <select id="filterCategory">
            <option value="All">All Categories</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Shopping">Shopping</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
    </section>
    
    <section class="table-section">
      <table id="expenseTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Amount (Birr)</th>
            <th>Category</th>
            <th>Date</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="expenseList">
        </tbody>
      </table>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
